name: CI

concurrency:
  # One CI run per ref: superseded pushes cancel the redundant queue entry.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log
      - name: Report test failures as annotations
        if: failure()
        run: |
          # One annotation per meaningful failure line; the full log stays in the Tests step output.
          grep -E "^(not ok|✖)|AssertionError|SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find" /tmp/test-output.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Build
        run: npm run build
      - name: Bundle size budget
        run: |
          # Raw (minified) JS in dist/assets. The budget is generous on purpose:
          # it only catches sudden regressions (a reverted code-split build, an
          # accidentally duplicated dependency), not normal growth.
          TOTAL=$(du -cb dist/assets/*.js 2>/dev/null | tail -1 | cut -f1 || echo 0)
          LIMIT=1400000
          echo "JS bundle total: $TOTAL bytes (budget: $LIMIT)"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "::error::No JS assets found in dist/assets"; exit 1
          fi
          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "::error::JS bundle ($TOTAL bytes) exceeds the budget ($LIMIT bytes)"; exit 1
          fi
